<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>FLATBED S-1200</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101214'/%3E%3Crect x='5' y='5' width='22' height='22' rx='3' fill='%2306080a' stroke='%232c3236'/%3E%3Crect x='5' y='14' width='22' height='3' fill='%2349f2a5'/%3E%3C/svg%3E">
<style>
  :root{
    --chassis:#101214;
    --panel:#1a1e21;
    --panel-edge:#2c3236;
    --glass:#06080a;
    --ink:#e6ece7;
    --muted:#7e8a84;
    --lamp:#49f2a5;
    --lamp-dim:#17493a;
    --busy:#ff5546;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--chassis)}
  body{font-family:var(--mono);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 10px}
  .brand{font-size:13px;font-weight:700;letter-spacing:.2em}
  .brand b{color:var(--lamp);font-weight:700}
  .status{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--muted)}
  #led{width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
  #led.scanning{background:var(--busy);box-shadow:0 0 8px var(--busy);animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  @media (prefers-reduced-motion: reduce){#led.scanning{animation:none}}
  #bay{flex:1;margin:0 12px;position:relative;border:1px solid var(--panel-edge);border-radius:10px;background:var(--glass);overflow:hidden;box-shadow:inset 0 0 32px rgba(0,0,0,.75)}
  #platen{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:var(--muted);background:rgba(8,10,11,.78);border:1px solid var(--panel-edge);padding:6px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;transition:opacity .5s}
  #hint.off{opacity:0}
  footer{display:flex;align-items:flex-end;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .deck{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
  .lbl{font-size:9px;letter-spacing:.18em;color:var(--muted);flex:none}
  .fxrow{display:flex;align-items:center;gap:10px;min-width:0}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;background:var(--panel);border:1px solid var(--panel-edge);border-radius:99px;color:var(--muted);font:inherit;font-size:10px;letter-spacing:.1em;padding:6px 11px;cursor:pointer}
  .chips button.on{background:var(--lamp-dim);border-color:var(--lamp);color:var(--ink)}
  .keys{display:flex;gap:8px}
  .key{background:var(--panel);border:1px solid var(--panel-edge);border-radius:7px;color:var(--ink);font:inherit;font-size:11px;letter-spacing:.12em;padding:10px 12px;cursor:pointer}
  .key:disabled{opacity:.3;cursor:default}
  .segrow{display:flex;align-items:center;gap:10px}
  .seg{display:flex;border:1px solid var(--panel-edge);border-radius:7px;overflow:hidden}
  .seg button{background:var(--panel);border:0;color:var(--muted);font:inherit;font-size:11px;letter-spacing:.08em;padding:7px 12px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--panel-edge)}
  .seg button.on{background:var(--lamp-dim);color:var(--ink)}
  #scanBtn{flex:none;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#242b28,#13171a 72%);border:2px solid var(--lamp);color:var(--lamp);font:inherit;font-size:12px;font-weight:700;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 16px rgba(73,242,165,.22),inset 0 2px 8px rgba(0,0,0,.65)}
  #scanBtn.busy{border-color:var(--busy);color:var(--busy);box-shadow:0 0 16px rgba(255,85,70,.28),inset 0 2px 8px rgba(0,0,0,.65)}
  #scanBtn:active{transform:scale(.96)}
  button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
</style>

<div id="app">
  <header>
    <div class="brand">FLATBED <b>S-1200</b></div>
    <div class="status"><span id="led"></span><span id="statusText">READY</span></div>
  </header>
  <main id="bay">
    <canvas id="platen"></canvas>
    <div id="hint">DRAG THE ORIGINAL WHILE IT SCANS</div>
  </main>
  <footer>
    <div class="deck">
      <div class="fxrow" id="fxRow">
        <span class="lbl">FX</span>
        <div class="chips" id="fxChips">
          <button data-fx="rgb">RGB</button>
          <button data-fx="glitch">GLITCH</button>
          <button data-fx="pix">PIX</button>
          <button data-fx="dot">DOT</button>
          <button data-fx="crt">CRT</button>
          <button data-fx="twist">TWIST</button>
        </div>
      </div>
      <div class="keys">
        <button id="loadBtn" class="key">LOAD</button>
        <button id="camBtn" class="key">CAM</button>
        <button id="saveBtn" class="key" disabled>SAVE</button>
        <button id="feedBtn" class="key" disabled>RE-FEED</button>
      </div>
      <div class="segrow">
        <span class="lbl">RES</span>
        <div class="seg" id="dpiSeg">
          <button data-ms="4000">150</button>
          <button data-ms="8000" class="on">300</button>
          <button data-ms="16000">600</button>
        </div>
        <span class="lbl">DPI</span>
      </div>
    </div>
    <button id="scanBtn">SCAN</button>
  </footer>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script src="vendor/pixi.min.js"></script>
<script src="vendor/pixi-filters.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const platen = $('platen'), hint = $('hint');
  const led = $('led'), statusText = $('statusText');
  const scanBtn = $('scanBtn'), loadBtn = $('loadBtn'), camBtn = $('camBtn');
  const saveBtn = $('saveBtn'), feedBtn = $('feedBtn');
  const fileInput = $('file'), dpiSeg = $('dpiSeg');
  const fxRow = $('fxRow'), fxChips = $('fxChips');
  const ctx = platen.getContext('2d');

  let dpr = 1, W = 0, H = 0;
  let result, resultCtx, noisePat;
  let source = null, sw = 0, sh = 0, mirror = false;
  const view = { x: 0, y: 0, scale: 1, rot: 0 };
  let mode = 'idle'; // idle | scanning | done
  let scanY = 0, scanStart = 0, scanDur = 8000, prefDur = 8000;
  let camStream = null, camFacing = 'user';
  const bootTime = performance.now();

  const makeCanvas = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });

  // --- render engine: PixiJS (WebGL, powers the FX rack) with a plain-2D fallback ---
  let usePixi = false, renderer = null, stage = null, sprite = null;
  let live2d = null, live2dCtx = null;
  const fxOn = new Set(), fxCache = {};
  let lastGlitch = 0;

  function initPixi() {
    if (!window.PIXI || !PIXI.filters || !PIXI.filters.GlitchFilter) return false;
    try {
      renderer = new PIXI.Renderer({
        width: 32, height: 32, resolution: 1, antialias: false,
        backgroundColor: 0x06080a, backgroundAlpha: 1, preserveDrawingBuffer: true,
      });
      stage = new PIXI.Container();
      sprite = new PIXI.Sprite(PIXI.Texture.EMPTY);
      sprite.anchor.set(0.5);
      stage.addChild(sprite);
      return true;
    } catch (err) {
      renderer = null;
      return false;
    }
  }

  const fxBuild = {
    rgb: () => new PIXI.filters.RGBSplitFilter([-6 * dpr, 0], [0, 0], [6 * dpr, 0]),
    glitch: () => new PIXI.filters.GlitchFilter({ slices: 10, offset: 40 * dpr, fillMode: 2 }),
    pix: () => new PIXI.filters.PixelateFilter(Math.round(11 * dpr)),
    dot: () => new PIXI.filters.DotFilter(0.9),
    crt: () => new PIXI.filters.CRTFilter({
      curvature: 1.5, lineWidth: 3 * dpr, lineContrast: 0.28,
      noise: 0.18, noiseSize: dpr, vignetting: 0.26,
    }),
    twist: () => new PIXI.filters.TwistFilter({
      angle: 3.2, radius: Math.min(W, H) * 0.48, offset: new PIXI.Point(W / 2, H / 2),
    }),
  };

  function applyFx() {
    const list = [...fxOn].map(k => (fxCache[k] ??= fxBuild[k]()));
    stage.filters = list.length ? list : null;
    stage.filterArea = renderer.screen;
  }

  function animateFx(t) {
    const s = (t - bootTime) / 1000;
    if (fxOn.has('rgb')) {
      const f = fxCache.rgb;
      // assign whole arrays: mutating .x/.y on the uniform value corrupts the upload
      f.red = [-7 * dpr * (0.5 + 0.5 * Math.sin(s * 2.1)), 3 * dpr * Math.sin(s * 1.3)];
      f.blue = [7 * dpr * (0.5 + 0.5 * Math.sin(s * 1.7 + 1)), 0];
    }
    if (fxOn.has('glitch') && s - lastGlitch > 0.15) {
      fxCache.glitch.seed = Math.random();
      fxCache.glitch.refresh();
      lastGlitch = s;
    }
    if (fxOn.has('crt')) {
      fxCache.crt.time = s * 8;
      fxCache.crt.seed = Math.random();
    }
    if (fxOn.has('twist')) fxCache.twist.angle = 3.4 * Math.sin(s * 0.7);
  }

  const liveCanvas = () => (usePixi ? renderer.view : live2d);

  function drawLive(t) {
    if (usePixi) {
      sprite.position.set(W / 2 + view.x, H / 2 + view.y);
      sprite.rotation = view.rot;
      sprite.scale.set(view.scale * (mirror ? -1 : 1), view.scale);
      animateFx(t);
      renderer.render(stage);
      return;
    }
    live2dCtx.fillStyle = '#06080a';
    live2dCtx.fillRect(0, 0, W, H);
    if (!source) return;
    live2dCtx.save();
    live2dCtx.translate(W / 2 + view.x, H / 2 + view.y);
    live2dCtx.rotate(view.rot);
    live2dCtx.scale(view.scale * (mirror ? -1 : 1), view.scale);
    live2dCtx.drawImage(source, -sw / 2, -sh / 2, sw, sh);
    live2dCtx.restore();
  }

  // --- sources: test target, uploaded photo, live camera, re-fed scan ---
  function setSource(el, w, h, mirrored) {
    source = el; sw = w; sh = h; mirror = !!mirrored;
    if (usePixi) {
      const old = sprite.texture;
      sprite.texture = PIXI.Texture.from(el);
      if (old && old !== PIXI.Texture.EMPTY) old.destroy(true);
    }
    fitSource();
    mode = 'idle';
    setStatus('READY');
  }

  function fitSource() {
    view.scale = Math.min(W / sw, H / sh) * 0.92;
    view.x = 0; view.y = 0; view.rot = 0;
  }

  function stopCam() {
    if (camStream) {
      camStream.getTracks().forEach(t => t.stop());
      camStream = null;
    }
    camBtn.textContent = 'CAM';
  }

  async function startCam() {
    setStatus('CAM…');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: camFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      stopCam();
      camStream = stream;
      const video = document.createElement('video');
      video.srcObject = stream;
      video.playsInline = true;
      video.muted = true;
      await video.play();
      setSource(video, video.videoWidth || 1280, video.videoHeight || 720, camFacing === 'user');
      camBtn.textContent = 'FLIP';
    } catch (err) {
      setStatus('CAM DENIED');
    }
  }

  // Calibration sheet shown before any photo is loaded, so the mechanic
  // is playable immediately — grids and circles warp legibly.
  function makeTarget() {
    const w = 1000, h = 1400;
    const c = makeCanvas(w, h), g = c.getContext('2d');
    g.fillStyle = '#eef0ea'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#c9cfc4'; g.lineWidth = 1;
    for (let x = 0; x <= w; x += 50) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 50) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.strokeStyle = '#1a1e21'; g.lineWidth = 6;
    g.strokeRect(25, 25, w - 50, h - 50);
    g.lineWidth = 3;
    for (let r = 60; r <= 330; r += 54) { g.beginPath(); g.arc(w / 2, 620, r, 0, Math.PI * 2); g.stroke(); }
    g.beginPath(); g.moveTo(w / 2, 240); g.lineTo(w / 2, 1000); g.moveTo(120, 620); g.lineTo(w - 120, 620); g.stroke();
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(25, 25); g.lineTo(w - 25, h - 25); g.stroke();
    const bars = ['#b4b4b4', '#b4b400', '#00b4b4', '#00b400', '#b400b4', '#b40000', '#0000b4'];
    const bw = (w - 160) / bars.length;
    bars.forEach((col, i) => { g.fillStyle = col; g.fillRect(80 + i * bw, 1070, bw, 140); });
    g.fillStyle = '#1a1e21';
    g.font = '700 58px ui-monospace,Menlo,monospace';
    g.textAlign = 'center';
    g.fillText('S-1200 TEST TARGET', w / 2, 150);
    g.font = '400 30px ui-monospace,Menlo,monospace';
    g.fillText('PLACE ORIGINAL FACE DOWN', w / 2, 1290);
    g.fillText('MOVE ORIGINAL DURING SCAN', w / 2, 1340);
    return c;
  }

  function makeNoise() {
    const c = makeCanvas(256, 256), g = c.getContext('2d');
    const d = g.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = Math.random() * 255;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 255;
    }
    g.putImageData(d, 0, 0);
    return c;
  }

  function setStatus(text, state) {
    statusText.textContent = text;
    led.className = state === 'scanning' ? 'scanning' : '';
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = platen.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width * dpr));
    H = Math.max(1, Math.round(r.height * dpr));
    platen.width = W; platen.height = H;
    if (usePixi) {
      renderer.resize(W, H);
      if (fxCache.twist) {
        fxCache.twist.radius = Math.min(W, H) * 0.48;
        fxCache.twist.offset.x = W / 2;
        fxCache.twist.offset.y = H / 2;
      }
    } else {
      live2d = makeCanvas(W, H);
      live2dCtx = live2d.getContext('2d');
    }
    const old = result;
    result = makeCanvas(W, H); resultCtx = result.getContext('2d');
    resultCtx.fillStyle = '#06080a'; resultCtx.fillRect(0, 0, W, H);
    if (old) resultCtx.drawImage(old, 0, 0, W, H);
    noisePat = resultCtx.createPattern(makeNoise(), 'repeat');
    if (mode === 'scanning') stopScan('STOPPED');
    if (source) fitSource();
  }

  function drawLamp() {
    const glow = 42 * dpr;
    const g = ctx.createLinearGradient(0, scanY - glow, 0, scanY + glow);
    g.addColorStop(0, 'rgba(73,242,165,0)');
    g.addColorStop(0.5, 'rgba(73,242,165,0.32)');
    g.addColorStop(1, 'rgba(73,242,165,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, scanY - glow, W, glow * 2);
    ctx.fillStyle = 'rgba(225,255,240,0.95)';
    ctx.fillRect(0, scanY - dpr, W, 2 * dpr);
  }

  // The heart of the machine: commit only the strip under the lamp,
  // with a hair of carriage wobble and CCD grain.
  function captureStrip(y0, y1) {
    const wobble = (Math.random() - 0.5) * 1.2 * dpr;
    resultCtx.drawImage(liveCanvas(), 0, y0, W, y1 - y0, wobble, y0, W, y1 - y0);
    resultCtx.save();
    resultCtx.globalAlpha = 0.055;
    resultCtx.fillStyle = noisePat;
    resultCtx.fillRect(0, y0, W, y1 - y0);
    resultCtx.restore();
  }

  function render() {
    if (mode === 'done') { ctx.drawImage(result, 0, 0); return; }
    if (mode === 'scanning') {
      ctx.drawImage(result, 0, 0);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, scanY, W, H - scanY); ctx.clip();
      ctx.drawImage(liveCanvas(), 0, 0);
      ctx.restore();
      drawLamp();
    } else {
      ctx.drawImage(liveCanvas(), 0, 0);
    }
  }

  function startScan() {
    resultCtx.fillStyle = '#06080a'; resultCtx.fillRect(0, 0, W, H);
    scanY = 0;
    scanDur = prefDur;
    scanStart = performance.now();
    mode = 'scanning';
    scanBtn.textContent = 'STOP';
    scanBtn.classList.add('busy');
    hint.classList.add('off');
    setStatus('SCANNING 0%', 'scanning');
  }

  function endScan(label) {
    mode = 'done';
    scanBtn.textContent = 'SCAN';
    scanBtn.classList.remove('busy');
    saveBtn.disabled = false;
    feedBtn.disabled = false;
    setStatus(label);
  }

  function stopScan(label) {
    if (scanY > H * 0.03) { endScan(label); }
    else {
      mode = 'idle';
      scanBtn.textContent = 'SCAN';
      scanBtn.classList.remove('busy');
      setStatus('READY');
    }
  }

  function tick(ts) {
    if (mode === 'scanning') {
      const p = Math.min(1, (ts - scanStart) / scanDur);
      const ny = Math.round(p * H);
      drawLive(ts);
      if (ny > scanY) { captureStrip(scanY, ny); scanY = ny; }
      setStatus('SCANNING ' + Math.round(p * 100) + '%', 'scanning');
      if (p >= 1) endScan('COMPLETE');
    } else {
      drawLive(ts);
    }
    render();
    requestAnimationFrame(tick);
  }

  // --- gestures: 1 finger pans, 2 fingers pinch-zoom + rotate ---
  const pts = new Map();

  function pivotTransform(px, py, k, dAng) {
    const vx = px - (W / 2 + view.x), vy = py - (H / 2 + view.y);
    const cos = Math.cos(dAng), sin = Math.sin(dAng);
    view.x += vx - k * (vx * cos - vy * sin);
    view.y += vy - k * (vx * sin + vy * cos);
    view.scale = Math.min(40, Math.max(0.05, view.scale * k));
    view.rot += dAng;
  }

  platen.addEventListener('pointerdown', e => {
    platen.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === 'done') { mode = 'idle'; setStatus('READY'); }
  });

  platen.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    if (pts.size === 1) {
      view.x += (e.clientX - p.x) * dpr;
      view.y += (e.clientY - p.y) * dpr;
    } else {
      const otherId = [...pts.keys()].find(id => id !== e.pointerId);
      const o = pts.get(otherId);
      const d0 = Math.hypot(p.x - o.x, p.y - o.y) || 1;
      const d1 = Math.hypot(e.clientX - o.x, e.clientY - o.y) || 1;
      const dAng = Math.atan2(e.clientY - o.y, e.clientX - o.x) - Math.atan2(p.y - o.y, p.x - o.x);
      const rect = platen.getBoundingClientRect();
      const m0x = ((p.x + o.x) / 2 - rect.left) * dpr, m0y = ((p.y + o.y) / 2 - rect.top) * dpr;
      const m1x = ((e.clientX + o.x) / 2 - rect.left) * dpr, m1y = ((e.clientY + o.y) / 2 - rect.top) * dpr;
      pivotTransform(m0x, m0y, d1 / d0, dAng);
      view.x += m1x - m0x;
      view.y += m1y - m0y;
    }
    p.x = e.clientX; p.y = e.clientY;
  });

  const release = e => pts.delete(e.pointerId);
  platen.addEventListener('pointerup', release);
  platen.addEventListener('pointercancel', release);
  platen.addEventListener('contextmenu', e => e.preventDefault());

  // Desktop: wheel zooms, shift+wheel rotates.
  platen.addEventListener('wheel', e => {
    e.preventDefault();
    if (mode === 'done') { mode = 'idle'; setStatus('READY'); }
    const rect = platen.getBoundingClientRect();
    const px = (e.clientX - rect.left) * dpr, py = (e.clientY - rect.top) * dpr;
    if (e.shiftKey) pivotTransform(px, py, 1, e.deltaY * 0.002);
    else pivotTransform(px, py, Math.exp(-e.deltaY * 0.0015), 0);
  }, { passive: false });

  // --- controls ---
  scanBtn.addEventListener('click', () => {
    if (mode === 'scanning') stopScan('STOPPED');
    else startScan();
  });

  dpiSeg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    prefDur = +b.dataset.ms;
    [...dpiSeg.children].forEach(x => x.classList.toggle('on', x === b));
  });

  fxChips.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const key = b.dataset.fx;
    if (fxOn.has(key)) fxOn.delete(key); else fxOn.add(key);
    b.classList.toggle('on', fxOn.has(key));
    applyFx();
  });

  loadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      stopCam();
      setSource(img, img.naturalWidth, img.naturalHeight);
    };
    img.onerror = () => { URL.revokeObjectURL(url); setStatus('READ ERROR'); };
    img.src = url;
    fileInput.value = '';
  });

  camBtn.addEventListener('click', () => {
    if (camStream) camFacing = camFacing === 'user' ? 'environment' : 'user';
    startCam();
  });

  // Feed the scan back in as the new original — artifacts compound.
  feedBtn.addEventListener('click', () => {
    const snap = makeCanvas(W, H);
    snap.getContext('2d').drawImage(result, 0, 0);
    stopCam();
    setSource(snap, W, H);
  });

  saveBtn.addEventListener('click', () => {
    result.toBlob(async blob => {
      if (!blob) return;
      const file = new File([blob], 'flatbed-scan.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (err) { /* fall through to download */ }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'flatbed-scan.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
  });

  // --- boot ---
  usePixi = initPixi();
  if (!usePixi) fxRow.style.display = 'none';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) camBtn.disabled = true;
  window.addEventListener('resize', resize);
  resize();
  const target = makeTarget();
  setSource(target, target.width, target.height);
  requestAnimationFrame(tick);
})();
</script>
</html>
