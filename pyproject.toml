[project]
name = "leadgen"
version = "0.1.0"
description = "Lead qualification pipeline for a solo freelance web developer in Bangalore"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leadgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
